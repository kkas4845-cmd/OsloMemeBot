name: Trygg-forst-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # hvert 10. minutt
  workflow_dispatch:          # lar deg starte den manuelt med en knapp

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  kjor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kjor boten
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python bot.py
      - name: Lagre hukommelsen
        run: |
          git config user.name "trygg-forst-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Oppdater tilstand" && git pull --rebase && git push)
