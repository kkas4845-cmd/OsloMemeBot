name: Papirtest

on:
  workflow_dispatch:          # start manuelt med knappen "Run workflow"
  push:
    paths: ["papirtest.start"] # eller ved at filen papirtest.start endres

permissions:
  contents: write

concurrency:
  group: papirtest
  cancel-in-progress: false

jobs:
  kjor:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kjor papirtesten
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u papirtest.py
      - name: Lagre resultatet
        if: always()
        run: |
          git config user.name "trygg-forst-bot"
          git config user.email "bot@users.noreply.github.com"
          git add papir.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Papirtest: resultat" && git pull --rebase && git push)
